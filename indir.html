<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paintline – Download</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{color-scheme:light dark;--bg:#120f2e;--fg:#fff}
  body{margin:0;min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;background:radial-gradient(120% 80% at 50% 35%,#2a2160,#120f2e 60%,#07060f);color:var(--fg);font:600 16px/1.4 system-ui,sans-serif;padding:24px}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 36px #0009}
  h1{margin:6px 0 0;font:900 34px/1 system-ui,sans-serif;letter-spacing:.02em;background:linear-gradient(90deg,#ff5fa2,#ffb84d,#5fe0c8,#7aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  a{display:block;min-width:240px;padding:14px 22px;border-radius:999px;color:#1a1033;background:linear-gradient(90deg,#ffd36b,#ff9fc4);text-decoration:none;font-weight:800}
  a.alt{background:#ffffff1f;color:#fff}
  p{margin:0;opacity:.8;max-width:320px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<img src="icons/icon-192.png" alt="">
<h1>PAINTLINE</h1>
<p id="msg">Opening the store…</p>
<a id="ios" href="https://apps.apple.com/app/id6832677465">App Store</a>
<a id="and" href="https://play.google.com/store/apps/details?id=lol.paintline.app">Google Play</a>
<a class="alt" href="/">Play in the browser</a>
<script>
// Reklamların tek bağlantısı: iPhone → App Store, Android → Google Play, bilgisayar → bu sayfa (iki düğme + tarayıcıda oyna).
// Kayıt, çerez ya da izleme yok. ANDROID_PUBLIC: Play'de herkese açık yayına geçince true yap; o zamana kadar Android tarayıcıdaki oyuna gider.
const ANDROID_PUBLIC = false;
const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
if (/^tr\b/i.test(navigator.language)) { document.documentElement.lang = 'tr'; document.title = 'Paintline – İndir'; document.getElementById('msg').textContent = 'Mağaza açılıyor…'; document.querySelector('a.alt').textContent = 'Tarayıcıda oyna'; }
if (!ANDROID_PUBLIC) document.getElementById('and').hidden = true;
const go = ios ? document.getElementById('ios').href : android ? (ANDROID_PUBLIC ? document.getElementById('and').href : '/') : null;
if (go) location.replace(go); else document.getElementById('msg').hidden = true;
</script>
</body>
</html>
