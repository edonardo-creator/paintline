<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0C15"><title>Paintline · Güncelle</title>
<style>html{color-scheme:dark}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0a0c15;color:#eceef7;font:16px/1.55 system-ui,sans-serif}.card{max-width:360px;margin:24px;padding:28px;border:1px solid #333952;border-radius:28px;background:#1b1e2e}h1{font-size:28px;letter-spacing:-1px;margin:0 0 12px}p{color:#b5bcd2}button,a{box-sizing:border-box;width:100%;display:block;border:0;border-radius:16px;padding:16px;font:700 15px system-ui;text-align:center;text-decoration:none;cursor:pointer}button{background:#b9a2ff;color:#171226}button:disabled{opacity:.6}a{color:#eceef7;background:#282c42;margin-top:10px}small{color:#a0a7bf}</style>
<main class="card"><h1>Paintline</h1><p id="status" role="status">Oturumun hazır. Güncel sürümü açarken ilerlemen ve jetonların korunur.</p><button id="go">Güncelle ve oyuna dön</button><a href="./">Oyuna dön</a><p><small>Uygulamayı silmene veya oyun verilerini temizlemene gerek yok.</small></p></main>
<script>
const button=document.getElementById('go'),status=document.getElementById('status');
const bounded=(promise,ms=15000)=>{let t;return Promise.race([promise,new Promise((_,reject)=>t=setTimeout(()=>reject(Error('timeout')),ms))]).finally(()=>clearTimeout(t));};
button.onclick=async()=>{button.disabled=true;status.textContent='Güncel dosyalar hazırlanıyor…';try{
 if(!navigator.onLine)throw Error('offline');
 const reg=await bounded(navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}));await bounded(reg.update());
 if(reg.installing)await bounded(new Promise((resolve,reject)=>{const w=reg.installing;const changed=()=>{if(w.state==='installed'||w.state==='activated')resolve();if(w.state==='redundant')reject(Error('install'));};w.addEventListener('statechange',changed);changed();}));
 if(reg.waiting){const old=navigator.serviceWorker.controller;await bounded(new Promise(resolve=>{const done=()=>{if(navigator.serviceWorker.controller!==old){navigator.serviceWorker.removeEventListener('controllerchange',done);resolve();}};navigator.serviceWorker.addEventListener('controllerchange',done);reg.waiting.postMessage({type:'SKIP_WAITING'});}));}
 await bounded(navigator.serviceWorker.ready);location.replace('./');
}catch(e){status.textContent=e.message==='offline'?'İnternete bağlanıp tekrar dene.':'Güncelleme tamamlanamadı. Bağlantını kontrol edip tekrar dene.';button.disabled=false;}};
</script></html>
